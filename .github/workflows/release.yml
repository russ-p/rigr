name: Create GitHub Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body: |
            ## rigr ${{ github.ref_name }}

            First tagged release.

            - Run with Docker Compose using the image `ghcr.io/${{ github.repository }}:${{ github.ref_name }}`
            - See `README.md` for configuration and endpoints

